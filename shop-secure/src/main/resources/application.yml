spring:
  application:
    name: shop-secure
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level rid=%X{rid} %logger{0} : %msg%n"

shop:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
  seed:
    admin-password: ${SHOP_SEED_ADMIN_PASSWORD:}
    customer-password: ${SHOP_SEED_CUSTOMER_PASSWORD:}
