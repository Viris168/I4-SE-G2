spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        # Task 5: JDBC batching
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        # Task 5: default_batch_fetch_size: 32 is NOT set globally, because it would also batch the
        # naive N+1 demo. ProductNameReportTest switches it on to show how it caps the regression.
  data:
    web:
      pageable:
        serialization-mode: via_dto
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # Task 5: shows "Executing JDBC batch" (Hibernate 7 logger name; Hibernate 6 used org.hibernate.engine.jdbc.batch)
    org.hibernate.orm.jdbc.batch: TRACE
